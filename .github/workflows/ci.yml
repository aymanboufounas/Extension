name: PyBMS extension checks
on:
  push:
  pull_request:
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax and tests
        run: npm run check
      - name: Package Marketplace VSIX
        run: python scripts/package_vsix.py
      - uses: actions/upload-artifact@v4
        with:
          name: pybms-vsix
          path: dist/*.vsix
